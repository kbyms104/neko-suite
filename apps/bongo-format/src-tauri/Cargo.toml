[package]
name = "bongo-format"
version = "0.3.0"
description = "Bongo Format - Cat-themed clipboard data viewer & formatter powered by Tauri v2"
authors = ["Neko Suite Team"]
edition = "2021"
default-run = "bongo-format"

[lib]
name = "bongo_format_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.4"
sqlformat = "0.2"
csv = "1.3"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
