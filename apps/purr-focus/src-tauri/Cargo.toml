[package]
name = "purr-focus"
version = "0.4.0"
description = "Purr Focus - Minimal Pomodoro desktop pet & stretching companion powered by Tauri v2"
authors = ["Neko Suite Team"]
edition = "2021"
default-run = "purr-focus"

[lib]
name = "purr_focus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
