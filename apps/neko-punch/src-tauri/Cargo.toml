[package]
name = "neko-punch"
version = "0.2.0"
description = "Neko Punch - Port conflict & process killer utility powered by Tauri v2"
authors = ["Neko Suite Team"]
edition = "2021"
default-run = "neko-punch"

[lib]
name = "neko_punch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
anyhow = "1.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
